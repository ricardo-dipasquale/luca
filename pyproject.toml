[project]
name = "luca-agent"
version = "0.2.0"
description = "LUCA - Tutor de Bases de Datos: álgebra relacional y SQL, con RAG sobre los apuntes de la materia"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LUCA Development Team", email = "dev@uca.edu.ar"}
]
keywords = ["ai", "education", "tutor", "relational-algebra", "sql", "rag", "langgraph", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
requires-python = ">=3.12"
dependencies = [
    # Tutor (LLM + grafo)
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3",
    "langchain-core>=1.6",
    "langchain-openai>=1.6.7",
    "openai>=2.45.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    # Apuntes (RAG)
    "chromadb>=1.5",
    "pypdf>=5",
    "langchain-text-splitters>=1.0",
    # Ingesta de prácticas y validación de SQL
    "pandas>=3.0.0",
    "openpyxl>=3.0.0",
    "sqlglot>=30.22.0",
    # Frontend
    "flask>=2.3.0",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
luca-frontend = "frontend.run:main"
luca-ingest = "ingest.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "course", "ingest", "storage", "frontend", "tools", "guardrails"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.coverage.run]
source = ["agent", "course", "ingest", "storage", "frontend", "tools", "guardrails"]
