# Desarrollo local: tutor + Chroma. Para publicar usar docker-compose.prod.yml (ver deploy/README.md).
#
# Antes de levantar `luca`:
#   docker compose up -d chroma
#   python -m ingest            # prácticas → artifacts/, soluciones, apuntes → Chroma (puerto 8001)

services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: chroma
    ports:
      - "8001:8000"  # host 8001 for running `python -m ingest` locally
    volumes:
      - ./data/chroma:/data
    healthcheck:
      # The image ships bash but no curl/wget.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - luca-network

  luca:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luca-app
    ports:
      - "5000:5000"
    depends_on:
      chroma:
        condition: service_healthy
    volumes:
      - ./data/luca:/app/data          # SQLite: usuarios, conversaciones, memoria del tutor
      - ./artifacts:/app/artifacts:ro  # practicas.json generado por `python -m ingest`
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      DEFAULT_LLM_MODEL: "${DEFAULT_LLM_MODEL:-gpt-6-luna}"
      DEFAULT_LLM_TEMPERATURE: "${DEFAULT_LLM_TEMPERATURE:-0.1}"
      DEFAULT_LLM_MAX_TOKENS: "${DEFAULT_LLM_MAX_TOKENS:-4096}"
      DEFAULT_LLM_TIMEOUT: "${DEFAULT_LLM_TIMEOUT:-60}"
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: "${CHROMA_COLLECTION:-apuntes}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      LUCA_DB_PATH: "/app/data/luca.db"
      FLASK_ENV: "development"           # cookies sin Secure (http://localhost)
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-}"
    restart: unless-stopped
    networks:
      - luca-network

networks:
  luca-network:
    driver: bridge
